<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斬擊軌跡試映室</title><style>
:root{color-scheme:dark}body{background:#101b23;color:#e6e9de;font:16px system-ui;margin:24px}main{max-width:1100px;margin:auto}.cards{display:flex;flex-wrap:wrap;gap:18px}article{flex:1;min-width:260px;background:#1c3036;padding:16px;border:1px solid #526561}canvas{width:100%;background:#14292e;image-rendering:pixelated}a{color:#b3ded6}button,select{padding:12px;background:#2e4b52;color:white;border:1px solid #769291}p{line-height:1.7}.controls{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:20px 0}input[type=range]{width:220px}h1{margin-bottom:8px}small{color:#9fb8b6}</style>
<main><small>EYE CREATURE / MOTION STUDY 02</small><h1>斬擊軌跡試映室</h1><p>比較揮擊弧度、前緣掃掠與拖尾消散。三款配色共用實際遊戲的三段連招；主角與傷害不更換。</p>
<div class="controls"><button id="pause">暫停</button><label>招式 <select id="stage"><option value="0">三段輪播</option><option value="1">① 直斬</option><option value="2">② 迴旋斬</option><option value="3">③ 十字斬</option></select></label><label>速度 <select id="speed"><option value="1">原速</option><option value="0.25">¼ 慢速</option><option value="0.5">½ 慢速</option></select></label><label><input type="checkbox" id="reduce">減少動態</label><label>逐格 <input id="scrub" aria-label="斬擊進度" type="range" min="0" max="100" value="0"></label></div>
<div class="cards"></div><p><a href="../../?revision=bear-metamorphosis-v2">回遊戲試打</a> · <a href="../../?boss-preview=1&revision=bear-metamorphosis-v2">直接挑戰新版紅熊</a></p><p>直斬：上方起手，弧線掃向前下方。迴旋斬：橢圓環繞，尾端漸細。十字斬：兩道交錯弧光先後出現。參考動作原理，所有線條均由本專案重新繪製。</p></main>
<script type="module">
import {drawSlash,SLASH_STYLES} from '../../src/magic.mjs';import {loadHero} from '../../src/hero.js';
const hero=await loadHero(),descriptions=['象牙白亮芯與青綠薄邊，清楚看見揮擊前緣。','深色尾跡配青色切面，輪廓更像影子掃過。','赭紅拖尾與暖金亮芯，強調厚重的出手。'];
const canvases=SLASH_STYLES.map((name,i)=>{const a=document.createElement('article');a.innerHTML=`<h2>${i+1}. ${name}</h2><canvas width="320" height="240"></canvas><p>${descriptions[i]}</p>`;document.querySelector('.cards').append(a);return a.querySelector('canvas')});
let paused=false,last=0,time=0,scrub=null;const $=s=>document.querySelector(s);
$('#pause').onclick=()=>{paused=!paused;scrub=null;$('#pause').textContent=paused?'播放':'暫停'};
$('#scrub').oninput=e=>{paused=true;scrub=Number(e.target.value)/100;$('#pause').textContent='播放'};
function frame(now){if(!paused)time+=Math.min(.05,(now-last)/1000||0)*Number($('#speed').value);last=now;const progress=scrub??(time%1.15)/.3,reduced=$('#reduce').checked,stage=Number($('#stage').value)||Math.floor(time/1.15)%3+1;if(scrub===null)$('#scrub').value=Math.min(100,progress*100);canvases.forEach((c,i)=>{const g=c.getContext('2d');g.clearRect(0,0,320,240);g.fillStyle='#2b403a';g.fillRect(0,185,320,55);g.fillStyle='#657b63';g.fillRect(0,185,320,4);hero(g,progress<1?3:0,progress<1?Math.min(5,Math.floor(progress*6)):0,false,109,110);if(progress<1)drawSlash(g,{x:144,y:140,face:1,stage},progress,reduced,i);g.fillStyle='#abc4bf';g.font='14px system-ui';g.fillText(['','① 直斬','② 迴旋斬','③ 十字斬'][stage],14,24)});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
