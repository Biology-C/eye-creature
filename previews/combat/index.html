<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>斬擊特效比較</title><style>body{background:#101b23;color:#e6e9de;font:16px system-ui;margin:24px}main{max-width:1080px;margin:auto}.cards{display:flex;flex-wrap:wrap;gap:18px}article{flex:1;min-width:260px;background:#1c3036;padding:16px;border:1px solid #526561}canvas{width:100%;background:#14292e}a{color:#b3ded6}button{padding:12px;background:#2e4b52;color:white;border:1px solid #769291}p{line-height:1.7}</style><main><h1>三種斬擊特效</h1><p>三款共用相同攻擊範圍與傷害，只比較外觀。角色與背景維持原風格；可到遊戲上方切換「斬擊」實際試打。</p><button id="pause">暫停</button> <label><input type="checkbox" id="reduce">減少動態</label><div class="cards"></div><p><a href="../../">回遊戲試打</a> · <a href="../../?boss-preview=1">直接試玩紅熊</a></p></main><script type="module">
import {drawSlash,SLASH_STYLES} from '../../src/magic.mjs';import {loadHero} from '../../src/hero.js';
const hero=await loadHero(),descriptions=['薄而俐落的冷白刃光，最接近原本低彩度世界。','三道暗色裂痕配青色邊緣，呼應合成生物與影子。','短促的赭紅衝擊弧配金色火花，強調力量感。'];
const canvases=SLASH_STYLES.map((name,i)=>{const a=document.createElement('article');a.innerHTML=`<h2>${i+1}. ${name}</h2><canvas width="300" height="220"></canvas><p>${descriptions[i]}</p>`;document.querySelector('.cards').append(a);return a.querySelector('canvas')});
let paused=false,last=0,time=0;document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'播放':'暫停'};
function frame(now){if(!paused)time+=Math.min(.05,(now-last)/1000||0);last=now;const progress=(time%1.4)/.3,reduced=document.querySelector('#reduce').checked;canvases.forEach((c,i)=>{const g=c.getContext('2d');g.clearRect(0,0,300,220);g.fillStyle='#2b403a';g.fillRect(0,150,300,70);g.fillStyle='#657b63';g.fillRect(0,150,300,4);hero(g,progress<1?3:0,progress<1?Math.min(5,Math.floor(progress*6)):0,false,65,90);if(progress<1)drawSlash(g,{x:100,y:120,face:1},progress,reduced,i)});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
